      const session = await supabase.auth.getSession();

    // --- GAME 1: Aviator (Crash) --- //
    async function setupAviatorGame() {
      const container = document.getElementById('game-canvas-container');
      container.innerHTML = '<canvas id="aviator-canvas" width="480" height="240" aria-label="Aviator game canvas"></canvas>';
      const canvas = document.getElementById('aviator-canvas');
      const ctx = canvas.getContext('2d');

      const controls = document.getElementById('game-controls');
      controls.innerHTML = `
        <input type="number" id="aviator-bet" min="10" step="1" placeholder="Enter Bet Rs" aria-label="Bet amount" />
        <button id="btn-aviator-place-bet">Place Bet</button>
        <button id="btn-cashout" disabled>Cashout</button>
      `;

      const messageEl = document.getElementById('game-message');

      // Aviator game internal state
      let gameState = 'waiting'; // waiting, running, crashed, ended
      let multiplier = 1.0;
      let crashPoint = null;
      let multiplierIncSpeed = 0.02; // rate of multiplier growth
      let animFrameId = null;
      let betAmount = 0;
      let hasBet = false;
      let hasCashedOut = false;
      let cashoutMultiplier = null;

      // Set canvas dims for HiDPI
      function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = canvas.clientWidth * dpr;
        canvas.height = canvas.clientHeight * dpr;
        ctx.scale(dpr, dpr);
      }
      resizeCanvas();

      // Draw the red curve representing multiplier growth
      function drawCurve(progress) {
        ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);

        // Draw baseline axes
        ctx.strokeStyle = '#444';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(30, canvas.clientHeight - 30);
        ctx.lineTo(canvas.clientWidth - 10, canvas.clientHeight - 30);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(30, 10);
        ctx.lineTo(30, canvas.clientHeight - 30);
        ctx.stroke();

        // Draw multiplier curve, simple exponential-ish curve
        ctx.strokeStyle = '#e03e3e';
        ctx.lineWidth = 3;
        ctx.beginPath();
        const height = canvas.clientHeight - 40;
        const width = canvas.clientWidth - 40;
        ctx.moveTo(30, canvas.clientHeight - 30);
        for(let x=0; x <= width * progress; x++) {
          // Curve: multiplier ~ exp(x/150)
          const y = canvas.clientHeight - 30 - Math.min(height, Math.exp(x/150) * 15);
          ctx.lineTo(x + 30, y);
        }
        ctx.stroke();

        // Draw current multiplier text on curve
        ctx.fillStyle = '#e03e3e';
        ctx.font = 'bold 18px Arial';
        const multText = multiplier.toFixed(2) + 'x';
        ctx.fillText(multText, canvas.clientWidth - 80, 30);
      }

      function resetGame() {
        gameState = 'waiting';
        multiplier = 1.0;
        crashPoint = Number((Math.random() * 10 + 1).toFixed(2)); // crash between 1.00 and 11.00
        hasBet = false;
        hasCashedOut = false;
        cashoutMultiplier = null;
        betAmount = 0;
        multiplierIncSpeed = 0.02;
        messageEl.textContent = 'Place your bet and start the round.';
        document.getElementById('btn-cashout').disabled = true;
        drawCurve(0);
        clearTimeout(crashTimeout);
      }

      // Anim loop
      function animate() {
        if(gameState !== 'running') return;
        multiplier += multiplierIncSpeed;
        if(multiplier >= crashPoint) {
          gameState = 'crashed';
          messageEl.textContent = `Crashed at ${crashPoint.toFixed(2)}x! You lost Rs ${betAmount}.`;
          document.getElementById('btn-cashout').disabled = true;
          if(!hasCashedOut && hasBet) {
            // Player loses, nothing to add
          }
          // End round after short delay
          setTimeout(() => {
            resetGame();
          }, 2500);
          return;
        } else {
          messageEl.textContent = hasBet
            ? `Multiplier: ${multiplier.toFixed(2)}x. Press Cashout!`
            : 'Waiting for bet...';
          drawCurve(multiplier / (crashPoint+1));
        }
        animFrameId = requestAnimationFrame(animate);
      }

      // Place bet button handler
      document.getElementById('btn-aviator-place-bet').onclick = async () => {
        if(gameState !== 'waiting') {
          alert('Wait for the next round.');
          return;
        }
        const betInput = document.getElementById('aviator-bet');
        const bet = Number(betInput.value);
        if(isNaN(bet) || bet < 10) {
          alert('Minimum bet Rs 10.');
          return;
        }
        if(profile.balance < bet) {
          alert('Insufficient Balance');
          return;
        }
        try {
          showLoading(true);
          // Deduct bet immediately
          const newBalance = profile.balance - bet;
          const { error:updateErr } = await supabase.from('profiles').update({balance: newBalance}).eq('id', user.id);
          if(updateErr) throw updateErr;
          profile.balance = newBalance;
          updateBalanceUI();

          // Insert bet record in transactions table for audit (optional)
          await supabase.from('transactions').insert([{
            user_id: user.id,
            type: 'bet',
            amount: bet,
            status: 'pending',
            method: 'aviator',
            details: {}
          }]);

          betAmount = bet;
          hasBet = true;
          gameState = 'running';
          document.getElementById('btn-cashout').disabled = false;
          messageEl.textContent = `Game started! Bet Rs ${betAmount}. Press Cashout!`;
          animate();
        } catch(e) {
          alert('Failed to place bet: ' + e.message);
          profile.balance += bet; // rollback UI
          updateBalanceUI();
        } finally {
          showLoading(false);
        }
      };

      // Cashout button handler
      document.getElementById('btn-cashout').onclick = async () => {
        if(!hasBet || hasCashedOut) return;
        if(gameState !== 'running') {
          alert('Cannot cashout now.');
          return;
        }
        hasCashedOut = true;
        cashoutMultiplier = multiplier;
        const winAmount = Number((betAmount * cashoutMultiplier).toFixed(0));
        messageEl.textContent = `Cashed out at ${cashoutMultiplier.toFixed(2)}x! Won Rs ${winAmount}. Adding to balance...`;
        document.getElementById('btn-cashout').disabled = true;

        try {
          showLoading(true);
          // Add winnings to balance
          const newBalance = profile.balance + winAmount;
          const { error:updateErr } = await supabase.from('profiles').update({balance: newBalance}).eq('id', user.id);
          if(updateErr) throw updateErr;
          profile.balance = newBalance;
          updateBalanceUI();

          // Add transaction (win)
          await supabase.from('transactions').insert([{
            user_id: user.id,
            type: 'win',
            amount: winAmount,
            status: 'completed',
            method: 'aviator',
            details: { bet: betAmount, multiplier: cashoutMultiplier }
          }]);

          messageEl.textContent = `Congratulations! You won Rs ${winAmount}. Round Ends.`;
          gameState = 'ended';
          setTimeout(resetGame, 3000);

        } catch(e) {
          alert('Failed to add winnings: ' + e.message);
          // do nothing, balance not updated
        } finally {
          showLoading(false);
        }
      };

      resetGame();
    }


    // --- GAME 2: Plinko --- //
    async function setupPlinkoGame() {
      // Structure:
      // Ball dropped from top, falls through pegs, lands in multipliers zones below.
      // User bets Rs X, places drop, multiplier is determined by landing zone.
      // Bet deducted immediately, win added on success.

      const container = document.getElementById('game-canvas-container');
      container.innerHTML = '<canvas id="plinko-canvas" width="480" height="320" aria-label="Plinko game canvas"></canvas>';
      const canvas = document.getElementById('plinko-canvas');
      const ctx = canvas.getContext('2d');

      const controls = document.getElementById('game-controls');
      controls.innerHTML = `
        <input type="number" id="plinko-bet" min="10" step="1" placeholder="Enter Bet Rs" aria-label="Bet amount" />
        <button id="btn-plinko-drop">Drop Ball</button>
      `;

      const messageEl = document.getElementById('game-message');

      // Canvas dimensions and plinko board parameters
      const canvasWidth = canvas.clientWidth;
      const canvasHeight = canvas.clientHeight;

      // Pegs layout
      const rowCount = 9; 
      const colCount = 11;
      const pegRadius = 5;
      const xStart = 40;
      const yStart = 40;
      const xSpacing = (canvasWidth - 80) / (colCount - 1);
      const ySpacing = 28;

      // Multipliers zones below plinko board
      const multiplierZones = [
        {range: [0, 40], multiplier: 10},
        {range: [40, 80], multiplier: 5},
        {range: [80, 120], multiplier: 2},
        {range: [120, 160], multiplier: 1},
        {range: [160, 200], multiplier: 2},
        {range: [200, 240], multiplier: 5},
        {range: [240, 280], multiplier: 10},
      ];
      // Simplified to 7 zones, 40px each, from 0 to 280 px at bottom

      // Ball physics variables
      let ball = {
        x: 0, y: 0, radius: 7,
        velX: 0, velY: 0,
        bouncing: false,
      };

      // Peg positions cached for collision detection
      let pegs = [];

      // Animation state
      let animId = null;
      let dropRunning = false;
      let betAmount = 0;

      // Set canvas for HiDPI
      function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = canvas.clientWidth * dpr;
        canvas.height = canvas.clientHeight * dpr;
        ctx.scale(dpr, dpr);
      }
      resizeCanvas();

      // Setup pegs coordinates
      function setupPegs() {
        pegs = [];
        for(let r=0; r < rowCount; r++) {
          for(let c=0; c < colCount; c++) {
            const offset = r % 2 === 0 ? 0 : xSpacing/2;
            let x = xStart + c * xSpacing + offset;
            let y = yStart + r * ySpacing;
            if(x + pegRadius > canvasWidth - 20) continue;
            pegs.push({x, y});
          }
        }
      }
      setupPegs();

      // Drawing function
      function drawBoard() {
        ctx.clearRect(0,0,canvas.clientWidth, canvas.clientHeight);
        // Background
        ctx.fillStyle = "#111";
        ctx.fillRect(0, 0, canvas.clientWidth, canvas.clientHeight);

        // Draw pegs
        ctx.fillStyle = varRGBA('--neon-green', 0.75);
        pegs.forEach(peg => {
          ctx.beginPath();
          ctx.arc(peg.x, peg.y, pegRadius, 0, Math.PI * 2);
          ctx.fill();
        });

        // Draw multiplier zones bottom
        let zoneY = yStart + rowCount * ySpacing + 20;
        for(let i=0; i < multiplierZones.length; i++) {
          const zoneX = i * 40 + 20;
          ctx.fillStyle = '#222';
          ctx.fillRect(zoneX, zoneY, 40, 40);
          ctx.fillStyle = varRGBA('--gold', 1);
          ctx.font = 'bold 18px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(multiplierZones[i].multiplier + 'x', zoneX + 20, zoneY + 20);
        }
      }

      // Helper: rgba version of css var
      function varRGBA(name, alpha) {
        // Get computed var then add alpha
        const rgb = getComputedStyle(document.documentElement).getPropertyValue(name);
        if(!rgb) return `rgba(103,209,51,${alpha})`;
        // rgb is hex or rgb? Support rgb() only for performance
        const m = rgb.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
        if(!m) return `rgba(103,209,51,${alpha})`;
        return `rgba(${m[1]},${m[2]},${m[3]},${alpha})`;
      }

      // Draw ball
      function drawBall() {
        ctx.fillStyle = varRGBA('--red', 1);
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      // Ball physics update with simple gravity + collision
      function updatePhysics() {
        const gravity = 0.5;
        ball.velY += gravity;
        ball.x += ball.velX;
        ball.y += ball.velY;

        // Collision with pegs
        pegs.forEach(peg => {
          const dx = ball.x - peg.x;
          const dy = ball.y - peg.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if(dist < ball.radius + pegRadius) {
            // Simple collision: reflect ball.velX slightly randomly
            ball.velX = (Math.random() < 0.5 ? -1 : 1) * 2.5;
            ball.velY *= -0.5;
          }
        });

        // Prevent ball from leaving canvas sides
        if(ball.x - ball.radius < 0) {
          ball.x = ball.radius;
          ball.velX = Math.abs(ball.velX);
        }
        if(ball.x + ball.radius > canvas.clientWidth) {
          ball.x = canvas.clientWidth - ball.radius;
          ball.velX = -Math.abs(ball.velX);
        }

        // Collision with bottom multiplier zone
        if(ball.y + ball.radius >= yStart + rowCount * ySpacing + 20) {
          ball.y = yStart + rowCount * ySpacing + 20 - ball.radius;
          ball.velX = 0; 
          ball.velY = 0;
          ball.bouncing = false;
          return true; // landed
        }
        return false;
      }

      // Main animation loop
      function animate() {
        drawBoard();
        drawBall();
        if(dropRunning) {
          if(updatePhysics()) {
            dropRunning = false;
            onBallLanded();
            return;
          }
          animId = requestAnimationFrame(animate);
        }
      }

      // Ball landed: calculate multiplier from zone
      function onBallLanded() {
        // Find landing zone index from ball.x
        const zoneIndex = Math.floor((ball.x - 20) / 40);
        let multi = 1;
        if(zoneIndex >= 0 && zoneIndex < multiplierZones.length) {
          multi = multiplierZones[zoneIndex].multiplier;
        }
        messageEl.textContent = `Ball landed! Multiplier: ${multi}x`;
        settleBet(multi);
      }

      // Settling bets win/loss
      async function settleBet(multiplier) {
        try {
          showLoading(true);

          // win calculation
          let winAmount = Math.floor(betAmount * multiplier);
          if(multiplier === 1) {
            messageEl.textContent += " - No winnings!";
            // no win, only bet lost
            await setTimeoutPromise(1500);
            resetGame();
            return;
          }

          // Add winnings to balance
          const newBalance = profile.balance + winAmount;
          const { error:updateErr } = await supabase.from('profiles').update({balance: newBalance}).eq('id', user.id);
          if(updateErr) throw updateErr;
          profile.balance = newBalance;
          updateBalanceUI();

          // Insert win transaction
          await supabase.from('transactions').insert([{
            user_id: user.id,
            type: 'win',
            amount: winAmount,
            status: 'completed',
            method: 'plinko',
            details: { bet: betAmount, multiplier }
          }]);
          messageEl.textContent += ` You won Rs ${winAmount}!`;
          await setTimeoutPromise(2500);
          resetGame();

        } catch(e) {
          alert('Failed settling bet: ' + e.message);
          resetGame();
        } finally {
          showLoading(false);
        }
      }

      function resetGame() {
        dropRunning = false;
        betAmount = 0;
        messageEl.textContent = 'Enter bet and drop ball.';
        document.getElementById('btn-plinko-drop').disabled = false;
        drawBoard();
      }

      function setTimeoutPromise(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      // Drop ball handler
      document.getElementById('btn-plinko-drop').onclick = async () => {
        if(dropRunning) return;
        const betInput = document.getElementById('plinko-bet');
        const bet = Number(betInput.value);
        if(isNaN(bet) || bet < 10) {
          alert('Minimum bet Rs 10.');
          return;
        }
        if(profile.balance < bet) {
          alert('Insufficient Balance');
          return;
        }
        try {
          showLoading(true);
          // Deduct bet immediately
          const newBalance = profile.balance - bet;
          const { error:updateErr } = await supabase.from('profiles').update({balance: newBalance}).eq('id', user.id);
          if(updateErr) throw updateErr;
          profile.balance = newBalance;
          updateBalanceUI();

          // Insert bet transaction (pending)
          await supabase.from('transactions').insert([{
            user_id: user.id,
            type: 'bet',
            amount: bet,
            status: 'pending',
            method: 'plinko',
            details: {}
          }]);
          betAmount = bet;

          // Reset ball starting position (top center)
          ball.x = canvas.clientWidth / 2;
          ball.y = 15;
          ball.velX = 0;
          ball.velY = 0;
          ball.bouncing = true;

          dropRunning = true;
          document.getElementById('btn-plinko-drop').disabled = true;
          messageEl.textContent = 'Ball dropped! Watching result...';

          animate();

        } catch(e) {
          alert('Failed to place bet: ' + e.message);
          profile.balance += bet; // rollback UI
          updateBalanceUI();
        } finally {
          showLoading(false);
        }
      };

      // Initial draw
      drawBoard();
      messageEl.textContent = 'Enter bet and drop ball.';
    }

    // --- GAME 3: Fortune Coins (Slots) --- //
    async function setupSlotsGame() {
      // 3 reel slots, spin animation with CSS/JS.
      // Deduct bet immediately, winnings by matching symbols.
      // Win = bet * multiplier based on matching symbols.

      const container = document.getElementById('game-canvas-container');
      container.innerHTML = `
        <div id="slots-container" aria-label="Slots Reels" role="group" tabindex="0">
          <div class="slot-reel" id="reel-1"></div>
          <div class="slot-reel" id="reel-2"></div>
          <div class="slot-reel" id="reel-3"></div>
        </div>
      `;

      const controls = document.getElementById('game-controls');
      controls.innerHTML = `
        <input type="number" id="slots-bet" min="10" step="1" placeholder="Enter Bet Rs" aria-label="Bet amount" />
        <button id="btn-slots-spin">Spin</button>
      `;
      const messageEl = document.getElementById('game-message');

      // Slot symbols - unicode emojis + multipliers for matching 3, 2 etc
      const symbols = [
        {symbol: '🍒', multiplier: 2},
        {symbol: '🔔', multiplier: 3},
        {symbol: '🍋', multiplier: 4},
        {symbol: '⭐', multiplier: 6},
        {symbol: '💰', multiplier: 10},
      ];

      // Reels references
      const reelEls = [
        document.getElementById('reel-1'),
        document.getElementById('reel-2'),
        document.getElementById('reel-3')
      ];

      // Fill reels static with random symbols before spin
      for(let reelEl of reelEls) {
        reelEl.textContent = symbols[Math.floor(Math.random() * symbols.length)].symbol;
      }

      let spinning = false;
      let betAmount = 0;

      // Spin animation for slot reels
      async function spinReels() {
        const spinDuration = 2500; // ms
        const spinFPS = 60;
        spinning = true;
        messageEl.textContent = 'Spinning... Good luck!';

        // Spin animation
        let elapsed = 0;
        let reelIntervals = [null, null, null];
        const spinSymbolsCount = symbols.length;

        // Start spinning all reels asynchronously, stop each in sequence
        for(let i=0; i < reelEls.length; i++) {
          reelIntervals[i] = setInterval(() => {
            reelEls[i].textContent = symbols[Math.floor(Math.random() * spinSymbolsCount)].symbol;
          }, 100);
        }

        // Wait durations between reels stopping
        const stopTimes = [1800, 2200, 2500];
        await new Promise(r => setTimeout(r, stopTimes[0]));
        clearInterval(reelIntervals[0]);
        await new Promise(r => setTimeout(r, stopTimes[1] - stopTimes[0]));
        clearInterval(reelIntervals[1]);
        await new Promise(r => setTimeout(r, stopTimes[2] - stopTimes[1]));
        clearInterval(reelIntervals[2]);

        // Pick final symbols
        let finalIndexes = [];
        for(let i=0; i < 3; i++) {
          finalIndexes[i] = Math.floor(Math.random() * spinSymbolsCount);
          reelEls[i].textContent = symbols[finalIndexes[i]].symbol;
        }
        return finalIndexes;
      }

      // Calculate winnings based on results
      function calculateWin(results) {
        // results: array of indexes in symbols array for each reel
        // Win conditions:
        // 3 matching symbols: bet * multiplier
        // 2 matching symbols: bet * (multiplier / 2)
        // else 0

        const bet = betAmount;
        const sym0 = results[0];
        const sym1 = results[1];
        const sym2 = results[2];

        if(sym0 === sym1 && sym1 === sym2) {
          const mul = symbols[sym0].multiplier;
          return bet * mul;
        } else if(sym0 === sym1 || sym1 === sym2 || sym0 === sym2) {
          // Find which matches, multiplier / 2
          let matchingIndex = sym0 === sym1 ? sym0 : sym1 === sym2 ? sym1 : sym0;
          return Math.floor(bet * (symbols[matchingIndex].multiplier / 2));
        }
        return 0;
      }

      document.getElementById('btn-slots-spin').onclick = async () => {
        if(spinning) return;
        const betInput = document.getElementById('slots-bet');
        const bet = Number(betInput.value);
        if(isNaN(bet) || bet < 10) {
          alert('Minimum bet Rs 10.');
          return;
        }
        if(profile.balance < bet) {
          alert('Insufficient Balance');
          return;
        }
        try {
          showLoading(true);
          // Deduct bet immediately
          const newBalance = profile.balance - bet;
          const { error:updateErr } = await supabase.from('profiles').update({balance: newBalance}).eq('id', user.id);
          if(updateErr) throw updateErr;
          profile.balance = newBalance;
          updateBalanceUI();

          // Insert bet transaction (pending)
          await supabase.from('transactions').insert([{
            user_id: user.id,
            type: 'bet',
            amount: bet,
            status: 'pending',
            method: 'fortune-coins',
            details: {}
          }]);
          betAmount = bet;

          // Spin reels animation
          const results = await spinReels();

          spinning = false;

          // Calculate win
          const winnings = calculateWin(results);
          if(winnings > 0) {
            messageEl.textContent = `You won Rs ${winnings}! Adding to balance...`;
            // Update DB balance
            const balanceAfterWin = profile.balance + winnings;
            const { error:winErr } = await supabase.from('profiles').update({balance: balanceAfterWin}).eq('id', user.id);
            if(winErr) throw winErr;
            profile.balance = balanceAfterWin;
            updateBalanceUI();

            // Insert win
            await supabase.from('transactions').insert([{
              user_id: user.id,
              type: 'win',
              amount: winnings,
              status: 'completed',
              method: 'fortune-coins',
              details: { bet: betAmount, results: results.map(i=>symbols[i].symbol) }
            }]);
          } else {
            messageEl.textContent = 'No win this time. Try again!';
          }
        } catch(e) {
          alert('Spin error: ' + e.message);
          // Rollback UI bet deduction
          profile.balance += betAmount;
          updateBalanceUI();
          spinning = false;
        } finally {
          showLoading(false);
        }
      };

      messageEl.textContent = 'Enter bet and spin the slots!';
    }

    // Listen to Supabase Auth Changes
